services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plant}
      POSTGRES_DB: ${POSTGRES_DB:-plant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      MODEL_PATH: /models/model.onnx
      CLASSES_PATH: /models/classes.json
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plant}:${POSTGRES_PASSWORD:-plant}@postgres:5432/${POSTGRES_DB:-plant}
      API_TOKENS: ${API_TOKENS}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: plant-disease-classifier
      MODEL_ALIAS: production
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      WEB_CONCURRENCY: "2"
      ORT_THREADS: "1"
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  ui:
    build: ./ui
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      UI_TOKEN: ${UI_TOKEN}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow
    ports:
      - "5000:5000"

  monitoring:
    build: ./monitoring
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plant}:${POSTGRES_PASSWORD:-plant}@postgres:5432/${POSTGRES_DB:-plant}
      REFERENCE_PATH: /app/reference.csv
      REPORTS_DIR: /reports
      DRIFT_WINDOW: "200"
      DRIFT_INTERVAL_MIN: "60"
      DRIFT_EXCLUDE_USERS: bob
    volumes:
      - reports:/reports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlflowdata:
  reports:
