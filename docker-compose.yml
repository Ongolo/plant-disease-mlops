services:

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plant}
      POSTGRES_DB: ${POSTGRES_DB:-plant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build: ./api
    environment:
      MODEL_PATH: /models/model.onnx
      CLASSES_PATH: /models/classes.json
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-plant}:${POSTGRES_PASSWORD:-plant}@postgres:5432/${POSTGRES_DB:-plant}
      API_TOKENS: ${API_TOKENS}
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  ui:
    restart: unless-stopped
    build: ./ui
    environment:
      API_URL: http://api:8000
      UI_TOKEN: ${UI_TOKEN}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    restart: unless-stopped
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow
    ports:
      - "5000:5000"

volumes:
  pgdata:
  mlflowdata:
